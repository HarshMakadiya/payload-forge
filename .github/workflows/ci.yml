name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace @payload-forge/prisma

      - name: Remove the local-only environment link
        run: rm -f apps/web/.env

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
