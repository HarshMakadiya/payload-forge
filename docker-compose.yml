services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payload_forge
      POSTGRES_PASSWORD: payload_forge
      POSTGRES_DB: payload_forge
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload_forge']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-payload-forge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-payload-forge-local}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/payload-forge-bodies &&
        mc ilm rule add --expire-days 7 local/payload-forge-bodies
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-payload-forge}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-payload-forge-local}

  api:
    build:
      context: .
      args:
        APP: api
    command:
      - /bin/sh
      - -c
      - >-
        npm run db:push --workspace @payload-forge/prisma &&
        npm run start --workspace @payload-forge/api
    environment: &backend-environment
      DATABASE_URL: postgresql://payload_forge:payload_forge@postgres:5432/payload_forge
      PORT: 4000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: payload-forge-bodies
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-payload-forge}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-payload-forge-local}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Generate a 32-byte base64 key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      TARGET_HOST_ALLOWLIST: ${TARGET_HOST_ALLOWLIST:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      METADATA_RETENTION_DAYS: 30
      CAPTURE_BODIES: 'true'
      MAX_CAPTURED_BODY_BYTES: 262144
      PRODUCTION_MAX_REQUESTS_PER_MINUTE: 1000
      PRODUCTION_MAX_CONCURRENCY: 50
      WORKER_RUN_CONCURRENCY: 2
      WORKER_VERSION: 0.1.0
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/v1/health']
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      args:
        APP: worker
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        APP: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
